name: Build and release app

# Builds a release APK, signs it with the repository's ANDROID_RELEASE_* secrets,
# and attaches it to a GitHub release. Runs on a tag push (v*.*) or on demand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v33.3)"
        required: true
        default: "v33.3"
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Set up Python for the on-device yt-dlp engine
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        id: sign
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename apk
        run: |
          ls -l app/build/outputs/apk/release
          cp "${{ steps.sign.outputs.signedFile }}" "Vimo-release.apk"
          ls -l Vimo-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Vimo-signed-apk
          path: Vimo-release.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Vimo ${{ github.event.inputs.tag || github.ref_name }}
          files: Vimo-release.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Signed release build of Vimo.

            - signed with the repository's ANDROID_RELEASE_* keystore
            - arm64-v8a only (the bundled Python runtime is per-ABI)
